name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=brianpugh&theme=vue-dark&show_icons=true&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          # TEMPORARY override away from "" (bundled core). The bundled core at
          # this action SHA is 2.1.3, which fails with "Resource not accessible
          # by integration": GitHub restricted the GraphQL stargazers{totalCount}
          # connection, so the stats card errored out (~2026-07-23). Fixed in
          # core 2.1.4+ (switched to the stargazerCount scalar; still no PAT
          # needed). The action hasn't re-bundled the fix yet (latest v2.0.2 and
          # main still pin 2.1.3), so pin an EXACT core version (not a moving
          # dist-tag) to pull the fix in via one deterministic npm install.
          # REVERT to "" once the action bundles core >=2.1.4, then bump the SHA.
          core_version: "2.1.5"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
